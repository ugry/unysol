version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: unysol-db
    environment:
      POSTGRES_USER: unysol
      POSTGRES_PASSWORD: unysol
      POSTGRES_DB: unysol
    ports:
      - "5433:5432"
    volumes:
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unysol"]
      interval: 3s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: unysol-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    container_name: unysol-backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://unysol:unysol@db:5432/unysol?sslmode=disable"
      JWT_SECRET: "unysol-dev-secret-change-in-production"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: unysol-frontend
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    restart: unless-stopped

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1011" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unysol" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Unysol — Kamyoncular için yük bulma, canlı takip ve otomatik fatura platformu. Telefondan ücretsiz başla, donanım gerekmez." />
    <meta name="keywords" content="nakliye programı, kamyon takip, yük bulma, lojistik yazılımı, filo yönetimi, ücretsiz nakliye programı" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Unysol — Yük Bul, Takip Et, Fatura Kes</title>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
      }
    </script>

    <!-- Install Prompt -->
    <script>
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show install button after 3 seconds
        setTimeout(() => {
          if (deferredPrompt) {
            const installBtn = document.createElement('button');
            installBtn.id = 'pwa-install-btn';
            installBtn.textContent = '📱 Uygulamayı Yükle';
            installBtn.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;background:#FF5F03;color:white;border:none;padding:12px 24px;border-radius:28px;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(255,95,3,0.4);cursor:pointer;animation:pwaSlideUp 0.3s ease';
            document.body.appendChild(installBtn);
            installBtn.onclick = () => {
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then(() => {
                installBtn.remove();
                deferredPrompt = null;
              });
            };
          }
        }, 3000);
      });
    </script>
    <style>
      @keyframes pwaSlideUp { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Unysol QA Environment
# Mirrors production AWS setup: ALB → (backend:8080 + frontend:5173)
# Extends docker-compose.yml with Caddy reverse proxy + production-like config

services:
  # ============================================================
  # Caddy Reverse Proxy (mirrors AWS ALB)
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: unysol-qa-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ============================================================
  # Backend — production-identical config
  # ============================================================
  backend:
    build: ./backend
    container_name: unysol-qa-backend
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: "redis://redis:6379/0"
      ENVIRONMENT: "qa"
    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Frontend — production-identical config  
  # ============================================================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost"
    container_name: unysol-qa-frontend
    expose:
      - "5173"
    restart: unless-stopped

  # ============================================================
  # PostgreSQL (matching RDS 16.x)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: unysol-qa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unysol"]
      interval: 3s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # Redis (matching ElastiCache 7.x)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: unysol-qa-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  qa_pgdata:
  caddy_data:
  caddy_config:

name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Rollback to which commit SHA? (find in ECR tags or git log)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
        default: 'Emergency rollback — production issue'

env:
  AWS_REGION: eu-central-1
  ECR_BACKEND: unysol/backend
  ECR_FRONTEND: unysol/frontend
  ECS_CLUSTER: unysol-cluster
  ECS_SERVICE_BACKEND: unysol-backend
  ECS_SERVICE_FRONTEND: unysol-frontend

jobs:
  validate-sha:
    name: Validate target SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SHA exists in git history
        run: |
          if git cat-file -e ${{ github.event.inputs.target_sha }} 2>/dev/null; then
            echo "✓ SHA ${{ github.event.inputs.target_sha }} found in git"
            echo "Commit message: $(git log -1 --format='%s' ${{ github.event.inputs.target_sha }})"
          else
            echo "✗ SHA ${{ github.event.inputs.target_sha }} NOT found in git"
            echo "Available recent commits:"
            git log --oneline -20
            exit 1
          fi

  rollback:
    name: Rollback ECS Services
    runs-on: ubuntu-latest
    needs: [validate-sha]
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify image exists in ECR
        id: ecr-check
        run: |
          TARGET_TAG="sha-${{ github.event.inputs.target_sha }}"
          echo "Looking for ECR image with tag: $TARGET_TAG"

          BACKEND_EXISTS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_BACKEND }} \
            --image-ids imageTag=$TARGET_TAG \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          FRONTEND_EXISTS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_FRONTEND }} \
            --image-ids imageTag=$TARGET_TAG \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$BACKEND_EXISTS" = "NOT_FOUND" ]; then
            echo "✗ Backend image not found in ECR for tag $TARGET_TAG"
            echo "Available backend images:"
            aws ecr describe-images \
              --repository-name ${{ env.ECR_BACKEND }} \
              --region ${{ env.AWS_REGION }} \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:10].imageTags[0]' \
              --output text | tr '\t' '\n' | grep 'sha-' || echo "  (none)"
            exit 1
          fi

          if [ "$FRONTEND_EXISTS" = "NOT_FOUND" ]; then
            echo "✗ Frontend image not found in ECR for tag $TARGET_TAG"
            exit 1
          fi

          echo "✓ Backend image found in ECR"
          echo "✓ Frontend image found in ECR"

          # Get ECR repo URL
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Get current task definition (to preserve config)
        id: current
        run: |
          BACKEND_TD=$(aws ecs describe-task-definition \
            --task-definition unysol-backend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Current backend TD: $BACKEND_TD"

          FRONTEND_TD=$(aws ecs describe-task-definition \
            --task-definition unysol-frontend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Current frontend TD: $FRONTEND_TD"

      - name: Register new backend task definition (pointing to rollback image)
        run: |
          TARGET_TAG="sha-${{ github.event.inputs.target_sha }}"
          ECR_URL="${{ steps.ecr-check.outputs.ecr_url }}"

          # Get current task definition as JSON
          aws ecs describe-task-definition \
            --task-definition unysol-backend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/current-backend-td.json

          # Replace image tag with rollback version
          jq --arg img "$ECR_URL:$TARGET_TAG" \
            '.containerDefinitions[0].image = $img' \
            /tmp/current-backend-td.json > /tmp/rollback-backend-td.json

          # Register new revision
          aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json "file:///tmp/rollback-backend-td.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text

          echo "Registered backend task definition with image: $ECR_URL:$TARGET_TAG"

      - name: Register new frontend task definition (pointing to rollback image)
        run: |
          TARGET_TAG="sha-${{ github.event.inputs.target_sha }}"
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition unysol-frontend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/current-frontend-td.json

          jq --arg img "$ECR_URL:$TARGET_TAG" \
            '.containerDefinitions[0].image = $img' \
            /tmp/current-frontend-td.json > /tmp/rollback-frontend-td.json

          aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json "file:///tmp/rollback-frontend-td.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text

          echo "Registered frontend task definition with image: $ECR_URL:$TARGET_TAG"

      - name: Rollback backend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --task-definition unysol-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Rollback frontend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --task-definition unysol-frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify rollback
        run: |
          echo "Backend health:"
          curl -sf https://unysolar.com/api/system/health && echo " ✓" || echo " ✗ FAILED"
          echo "Frontend:"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://unysolar.com/ && echo " (HTTP $HTTP_CODE) ✓")

      - name: Rollback summary
        if: always()
        run: |
          echo "============================================"
          echo "EMERGENCY ROLLBACK EXECUTED"
          echo "Requested by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Rollback to: ${{ github.event.inputs.target_sha }}"
          echo "Time: $(date -u)"
          echo "============================================"

name: Deploy to AWS Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: true
        type: string
        default: 'Bug fix or feature release'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-central-1
  ECR_BACKEND: unysol/backend
  ECR_FRONTEND: unysol/frontend
  ECS_CLUSTER: unysol-cluster
  ECS_SERVICE_BACKEND: unysol-backend
  ECS_SERVICE_FRONTEND: unysol-frontend
  FRONTEND_API_URL: https://unysolar.com

jobs:
  tests:
    name: Run Automated Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Build & Deploy (migrations on startup)
    runs-on: ubuntu-latest
    needs: [tests]
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with Stripe env vars
        run: |
          echo "Adding STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY to ECS task definition..."
          
          # Get current task definition
          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition unysol-backend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json)
          
          # Extract container definitions and add Stripe env vars
          NEW_CONTAINER_DEF=$(echo "$TASK_DEF_JSON" | jq -c \
            --arg sk "${{ secrets.STRIPE_SECRET_KEY }}" \
            --arg pk "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            '.containerDefinitions[0].environment += [
              {"name":"STRIPE_SECRET_KEY","value":$sk},
              {"name":"STRIPE_PUBLISHABLE_KEY","value":$pk}
            ] | .containerDefinitions')
          
          # Use existing family, role arns, cpu, memory from current definition
          FAMILY=$(echo "$TASK_DEF_JSON" | jq -r '.family')
          TASK_ROLE=$(echo "$TASK_DEF_JSON" | jq -r '.taskRoleArn')
          EXEC_ROLE=$(echo "$TASK_DEF_JSON" | jq -r '.executionRoleArn')
          CPU=$(echo "$TASK_DEF_JSON" | jq -r '.cpu')
          MEMORY=$(echo "$TASK_DEF_JSON" | jq -r '.memory')
          
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family "$FAMILY" \
            --task-role-arn "$TASK_ROLE" \
            --execution-role-arn "$EXEC_ROLE" \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu "$CPU" \
            --memory "$MEMORY" \
            --container-definitions "$NEW_CONTAINER_DEF" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New task definition: $NEW_TASK_DEF_ARN"
          
          # Update service to use new task definition
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Stripe env vars added to ECS task definition"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ env.FRONTEND_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Post-deploy smoke tests
        if: always()
        run: |
          echo "============================================"
          echo " Post-Deploy Smoke Tests"
          echo "============================================"
          PASS=0; FAIL=0
          check() {
            local code=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" "https://unysolar.com$2" 2>/dev/null)
            if echo "$code" | grep -qE "$3"; then
              echo "  ✓ $4 (HTTP $code)"; PASS=$((PASS+1))
            else
              echo "  ✗ $4 (HTTP $code, expected $3)"; FAIL=$((FAIL+1))
            fi
          }
          check GET "/api/system/health" "200" "Backend health"
          check GET "/api/system/health/ready" "200" "Backend readiness"
          check GET "/" "200" "Frontend"
          check GET "/login" "200" "Login page"
          check POST "/api/auth/login" "400\|401" "Auth endpoint"
          echo ""
          TIME=$(curl -s -o /dev/null -w "%{time_total}" https://unysolar.com/api/system/health)
          echo "  Response time: ${TIME}s"
          echo "============================================"
          echo " RESULTS: $PASS passed, $FAIL failed"
          echo "============================================"

      - name: Seed Stripe price IDs via admin API
        if: always()
        run: |
          echo "Seeding Stripe price IDs in production DB..."
          # Generate super admin JWT
          ADMIN_JWT=$(python3 -c "
  import jwt, time
  token = jwt.encode({
      'user_id': 24, 'tenant_id': 0,
      'email': 'ugur.yardimci@unygms.com',
      'role': 'SUPER_ADMIN',
      'exp': int(time.time()) + 600,
      'iat': int(time.time())
  }, '${{ secrets.JWT_SECRET }}', algorithm='HS256')
  print(token)
          ")
          
          curl -s -X PUT https://unysolar.com/api/admin/email/config \
            -H "Authorization: Bearer $ADMIN_JWT" \
            -H "Content-Type: application/json" \
            -d '{
              "stripe_price_monthly": "price_1TeBY6KWLIMlTHZnLitJ9nqz",
              "stripe_price_yearly": "price_1TeBYGKWLIMlTHZnOP2sgrEL",
              "stripe_pub_key": "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
            }' && echo "✅ Stripe price IDs seeded" || echo "⚠ Could not seed price IDs"

      - name: Deployment summary
        if: always()
        run: |
          echo "============================================"
          echo "Deployment Requested by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Time: $(date -u)"
          echo "============================================"

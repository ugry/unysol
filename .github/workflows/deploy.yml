name: Deploy to AWS Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: true
        type: string
        default: 'Bug fix or feature release'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_BACKEND: unysol/backend
  ECR_FRONTEND: unysol/frontend
  ECS_CLUSTER: unysol-cluster
  ECS_SERVICE_BACKEND: unysol-backend
  ECS_SERVICE_FRONTEND: unysol-frontend
  FRONTEND_API_URL: https://unysolar.com

jobs:
  tests:
    name: Run Automated Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Build, Migrate & Deploy
    runs-on: ubuntu-latest
    needs: [tests]
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ env.FRONTEND_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get ECS network config
        id: network
        run: |
          NETWORK=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          SUBNETS=$(echo "$NETWORK" | jq -r '.subnets | join(",")')
          SG=$(echo "$NETWORK" | jq -r '.securityGroups | join(",")')
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_groups=$SG" >> $GITHUB_OUTPUT

      - name: Run DB migration task
        id: migrate
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:sha-${{ github.sha }}"
          echo "Running migration with image: $IMAGE"
          
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition unysol-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.network.outputs.subnets }}],securityGroups=[${{ steps.network.outputs.security_groups }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["./server","--migrate-only"]}]}' \
            --started-by "github-actions-migration-${{ github.run_id }}" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          
          echo "Waiting for migration task..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }}
          
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with code $EXIT_CODE — aborting deploy"
            exit 1
          fi
          
          echo "Migration completed successfully"

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend stabilization
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }}

      - name: Post-deploy smoke tests
        if: always()
        run: |
          echo "============================================"
          echo " Post-Deploy Smoke Tests"
          echo "============================================"
          PASS=0; FAIL=0
          check() {
            local code=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" "https://unysolar.com$2" 2>/dev/null)
            if echo "$code" | grep -qE "$3"; then
              echo "  ✓ $4 (HTTP $code)"; PASS=$((PASS+1))
            else
              echo "  ✗ $4 (HTTP $code, expected $3)"; FAIL=$((FAIL+1))
            fi
          }
          check GET "/api/system/health" "200" "Backend health"
          check GET "/api/system/health/ready" "200" "Backend readiness"
          check GET "/" "200" "Frontend"
          check GET "/login" "200" "Login page"
          check POST "/api/auth/login" "400\|401" "Auth endpoint"
          echo ""
          TIME=$(curl -s -o /dev/null -w "%{time_total}" https://unysolar.com/api/system/health)
          echo "  Response time: ${TIME}s"
          echo "============================================"
          echo " RESULTS: $PASS passed, $FAIL failed"
          echo "============================================"

      - name: Deployment summary
        if: always()
        run: |
          echo "============================================"
          echo "Deployment Requested by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Time: $(date -u)"
          echo "============================================"

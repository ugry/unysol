name: Deploy to AWS Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: true
        type: string
        default: 'Bug fix or feature release'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_BACKEND: unysol/backend
  ECR_FRONTEND: unysol/frontend
  ECS_CLUSTER: unysol-cluster
  ECS_SERVICE_BACKEND: unysol-backend
  ECS_SERVICE_FRONTEND: unysol-frontend
  CODEDEPLOY_APP: unysol-app
  CODEDEPLOY_DG_BACKEND: unysol-backend-dg
  CODEDEPLOY_DG_FRONTEND: unysol-frontend-dg
  FRONTEND_API_URL: https://unysolar.com

jobs:
  tests:
    name: Run Automated Tests
    uses: ./.github/workflows/test.yml

  deploy-migrations:
    name: Pre-Deploy — Run Database Migrations
    runs-on: ubuntu-latest
    needs: [tests]
    environment:
      name: production
    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}
      frontend_image: ${{ steps.build-frontend.outputs.image }}
      sha_tag: ${{ steps.build-backend.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ env.FRONTEND_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get ECS service network config
        id: network
        run: |
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.subnets | join(",")')
          SG=$(echo "$SERVICE_JSON" | jq -r '.securityGroups | join(",")')
          
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_groups=$SG" >> $GITHUB_OUTPUT
          
          echo "  Subnets: $SUBNETS"
          echo "  Security groups: $SG"

      - name: Run migration task
        id: migrate
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:sha-${{ github.sha }}"
          echo "Running migration with image: $IMAGE"
          
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition unysol-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.network.outputs.subnets }}],securityGroups=[${{ steps.network.outputs.security_groups }}],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"command\":[\"./server\",\"--migrate-only\"],\"environment\":[{\"name\":\"IMAGE_TAG\",\"value\":\"sha-${{ github.sha }}\"}]}]}" \
            --started-by "github-actions-migration-${{ github.run_id }}" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Migration task ARN: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }}
          
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with code $EXIT_CODE"
            echo "Fetching logs..."
            aws logs get-log-events \
              --log-group-name /ecs/unysol/backend \
              --log-stream-name "backend/migration/${{ github.run_id }}" \
              --region ${{ env.AWS_REGION }} \
              --query 'events[*].message' \
              --output text 2>/dev/null || true
            exit 1
          fi
          
          echo "Migration completed successfully (exit code 0)"

  deploy:
    name: Deploy via CodeDeploy (Blue/Green)
    runs-on: ubuntu-latest
    needs: [deploy-migrations]
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update backend task definition (promote SHA image)
        id: backend-td
        run: |
          aws ecs describe-task-definition \
            --task-definition unysol-backend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/current-td.json
          
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_BACKEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          
          jq --arg img "$ECR_URL:sha-${{ github.sha }}" \
            '.containerDefinitions[0].image = $img' \
            /tmp/current-td.json > /tmp/new-td.json
          
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json "file:///tmp/new-td.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New backend task definition: $NEW_TD_ARN"
          echo "task_def_arn=$NEW_TD_ARN" >> $GITHUB_OUTPUT

      - name: Update frontend task definition (promote SHA image)
        id: frontend-td
        run: |
          aws ecs describe-task-definition \
            --task-definition unysol-frontend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json > /tmp/current-fd-td.json
          
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_FRONTEND }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          
          jq --arg img "$ECR_URL:sha-${{ github.sha }}" \
            '.containerDefinitions[0].image = $img' \
            /tmp/current-fd-td.json > /tmp/new-fd-td.json
          
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --region ${{ env.AWS_REGION }} \
            --cli-input-json "file:///tmp/new-fd-td.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New frontend task definition: $NEW_TD_ARN"
          echo "task_def_arn=$NEW_TD_ARN" >> $GITHUB_OUTPUT

      - name: Deploy backend via CodeDeploy (Blue/Green)
        id: deploy-backend
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DG_BACKEND }} \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"{\\\"version\\\":1,\\\"Resources\\\":[{\\\"TargetService\\\":{\\\"Type\\\":\\\"AWS::ECS::Service\\\",\\\"Properties\\\":{\\\"TaskDefinition\\\":\\\"${{ steps.backend-td.outputs.task_def_arn }}\\\",\\\"LoadBalancerInfo\\\":{\\\"ContainerName\\\":\\\"backend\\\",\\\"ContainerPort\\\":8080}}}}]}\"}}" \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentId' \
            --output text)
          
          echo "Backend CodeDeploy deployment: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          
          echo "Waiting for backend deployment..."
          aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID" \
            --region ${{ env.AWS_REGION }}
          
          echo "Backend deployment successful"

      - name: Deploy frontend via CodeDeploy (Blue/Green)
        id: deploy-frontend
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DG_FRONTEND }} \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"{\\\"version\\\":1,\\\"Resources\\\":[{\\\"TargetService\\\":{\\\"Type\\\":\\\"AWS::ECS::Service\\\",\\\"Properties\\\":{\\\"TaskDefinition\\\":\\\"${{ steps.frontend-td.outputs.task_def_arn }}\\\",\\\"LoadBalancerInfo\\\":{\\\"ContainerName\\\":\\\"frontend\\\",\\\"ContainerPort\\\":5173}}}}]}\"}}" \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentId' \
            --output text)
          
          echo "Frontend CodeDeploy deployment: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          
          echo "Waiting for frontend deployment..."
          aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID" \
            --region ${{ env.AWS_REGION }}
          
          echo "Frontend deployment successful"

      - name: Post-deploy smoke tests
        if: always()
        run: |
          echo "============================================"
          echo " Running Post-Deploy Smoke Tests"
          echo "============================================"
          
          PASS=0
          FAIL=0
          
          check() {
            local code=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" "https://unysolar.com$2" 2>/dev/null)
            if echo "$code" | grep -qE "$3"; then
              echo "  ✓ $4 (HTTP $code)"
              PASS=$((PASS+1))
            else
              echo "  ✗ $4 (HTTP $code, expected $3)"
              FAIL=$((FAIL+1))
            fi
          }
          
          echo "Health endpoints:"
          check GET "/api/system/health" "200" "Backend health"
          check GET "/api/system/health/ready" "200" "Backend readiness"
          check GET "/api/system/health/live" "200" "Backend liveness"
          
          echo ""
          echo "Frontend:"
          check GET "/" "200" "Homepage"
          check GET "/login" "200" "Login page"
          
          echo ""
          echo "Auth endpoints (expect 401 or 400):"
          check POST "/api/auth/login" "400\|401" "Login POST"
          check GET "/api/tenant/dashboard/summary" "401" "Dashboard (auth required)"
          
          echo ""
          echo "Response time:"
          TIME=$(curl -s -o /dev/null -w "%{time_total}" https://unysolar.com/api/system/health 2>/dev/null)
          echo "  Health response: ${TIME}s"
          
          echo ""
          echo "============================================"
          echo " RESULTS: $PASS passed, $FAIL failed"
          echo "============================================"
          
          if [ "$FAIL" -gt 0 ]; then
            echo "WARNING: Some smoke tests failed. Review before considering deployment healthy."
            exit 0
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "============================================"
          echo "Deployment Requested by: ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Time: $(date -u)"
          echo "============================================"

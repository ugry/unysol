name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # JOB 1: BACKEND (Go)
  # ============================================================
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # BUILT.md: Go binary must compile
      - name: Build check (linux/amd64)
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/server

      # TESTRESULTS.md: Go unit tests (no silent failures)
      - name: Go tests
        working-directory: backend
        run: go test ./... -v -count=1 -coverprofile=coverage.out -covermode=atomic

      # golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
          args: --timeout=5m

      # STATICWORKFLOWANDTEST.md: vet
      - name: Go vet
        working-directory: backend
        run: go vet ./...

      # BUILT.md: Handler count >= 18
      - name: Handler file count
        run: |
          COUNT=$(ls backend/internal/handlers/*.go 2>/dev/null | grep -v _test | wc -l)
          echo "Handler files: $COUNT"
          [ "$COUNT" -ge 18 ] || { echo "Expected >=18 handler files"; exit 1; }

      - name: govulncheck (info only)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck ./... || echo "Vulnerabilities found — tracked for remediation"

  # ============================================================
  # JOB 2: FRONTEND (React/Vite)
  # ============================================================
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint (info only — cleanup tracked in CICDimprovements.md)
        working-directory: frontend
        run: npx eslint src/ --max-warnings=500 || echo "ESLint issues found — tracked for future cleanup"

      - name: Build check
        working-directory: frontend
        run: npm run build

      - name: npm audit (info only)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "Vulnerabilities found — tracked for remediation"

      # BUILT.md: Page count >= 14
      - name: Frontend page count
        run: |
          COUNT=$(ls frontend/src/pages/*.tsx 2>/dev/null | wc -l)
          echo "Pages: $COUNT"
          [ "$COUNT" -ge 14 ] || { echo "Expected >=14 pages"; exit 1; }

      # STATICWORKFLOWANDTEST.md: No source maps in production
      - name: No .map files in dist
        run: |
          MAPS=$(find frontend/dist -name "*.map" 2>/dev/null | wc -l)
          [ "$MAPS" -eq 0 ] || { echo "Source maps found in dist ($MAPS files)"; exit 1; }

  # ============================================================
  # JOB 3: MODULE CONSISTENCY (UI_Test_Directives + modulecomparisongrid)
  # ============================================================
  module-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # modulecomparisongrid.md: Module ↔ Page mapping
      - name: Module consistency check
        run: bash scripts/check-module-consistency.sh

      # modulecomparisongrid.md: No module without frontend page
      - name: Missing frontend pages (max 7 allowed)
        run: |
          MISSING=$(bash scripts/check-module-consistency.sh 2>&1 | grep -c "missing frontend page" || true)
          echo "Missing frontend pages: $MISSING"
          [ "$MISSING" -le 7 ] || { echo "More than 7 modules missing frontend pages — regression!"; exit 1; }

      # BUILT.md: DB tables >= 29
      - name: Database table count (from schema)
        run: |
          TABLES=$(grep -c "CREATE TABLE" database/01-schema.sql 2>/dev/null || echo 0)
          echo "Tables in schema: $TABLES"
          [ "$TABLES" -ge 29 ] || { echo "Expected >=29 tables in schema"; exit 1; }

  # ============================================================
  # JOB 4: SECURITY (saaslandingpagesecurity.md)
  # ============================================================
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks — detect secrets and credentials in code
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # saaslandingpagesecurity.md: Security headers middleware exists
      - name: Security middleware file exists
        run: |
          [ -f backend/internal/middleware/security.go ] || { echo "security.go missing"; exit 1; }

      # saaslandingpagesecurity.md: Rate limit middleware exists
      - name: Rate limit middleware exists
        run: |
          grep -q "RateLimit" backend/internal/middleware/ratelimit.go || { echo "RateLimit missing"; exit 1; }

      # saaslandingpagesecurity.md: Email validation on signup
      - name: Email validation on signup
        run: |
          grep -q "IsValidEmail\|invalid email" backend/internal/handlers/auth.go || { echo "Email validation missing"; exit 1; }

      # saaslandingpagesecurity.md: Password strength rules
      - name: Password validation exists
        run: |
          grep -q "ValidatePassword\|en az.*karakter\|uppercase\|büyük harf" backend/internal/validator/validator.go || { echo "Password validation missing"; exit 1; }

      # saaslandingpagesecurity.md: Signup lockout exists
      - name: Signup lockout exists
        run: |
          grep -q "signupAttempts\|isSignupLockedOut" backend/internal/handlers/auth.go || { echo "Signup lockout missing"; exit 1; }

      # saaslandingpagesecurity.md: Demo rate limit configured
      - name: Demo route rate limited
        run: |
          grep -A2 "/api/demo" backend/cmd/server/main.go | grep -q "RateLimit" || { echo "Demo rate limit missing"; exit 1; }

      # B-SET-01: RequireTenant must reject tenant_id=0 (super admin)
      - name: "RequireTenant rejects super admin (tid=0)"
        run: |
          grep -B2 "http.Error.*Forbidden" backend/internal/middleware/auth.go | grep -q 'tid.*==.*"0"' || \
          grep -q 'tenant_id.*!=.*"0"\|tenand_id.*!=.*"0"\|tid.*!=.*"0"' backend/internal/middleware/auth.go || \
          { echo "❌ B-SET-01: RequireTenant does not reject tenant_id=0"; exit 1; }

      # B-SET-02: Notification PUT must return success:true
      - name: "Settings: Notification PUT returns success:true"
        run: |
          grep -A1 "notification preferences updated" backend/internal/handlers/settings.go | grep -q "Success: true" || \
          { echo "❌ B-SET-02: Notification PUT missing Success:true"; exit 1; }

      # B-SET-07: user_permissions table must exist in schema
      - name: "DB: user_permissions table defined in schema"
        run: |
          grep -q "CREATE TABLE.*user_permissions" database/01-schema.sql || \
          { echo "❌ B-SET-07: user_permissions table missing from schema"; exit 1; }

      # B-SET-08: GetPermissions/SavePermissions must handle errors
      - name: "DB: Permissions handlers have error handling"
        run: |
          if grep -q "permRows, _ := h.DB.Query" backend/internal/handlers/usermanagement.go; then
            echo "❌ B-SET-08: GetPermissions discards DB errors"
            exit 1
          fi
          if grep -q "_, _ = h.DB.Exec.*user_permissions" backend/internal/handlers/usermanagement.go; then
            echo "❌ B-SET-08: SavePermissions discards DB errors"
            exit 1
          fi
          echo "✅ Permissions handlers have proper error handling"

      # B-SET-09: Module seed data must use correct English enum values
      - name: "DB: Module seed data uses English enum values"
        run: |
          if grep -q "'FILO'\|'FINANS'\|'IK'\|'ANALITIK'" database/01-schema.sql; then
            echo "❌ B-SET-09: Module seed data has Turkish enum values (must be FLEET/FINANCE/HR/ANALYTICS)"
            exit 1
          fi
          echo "✅ Module seed data uses correct English enum values"

      # B-SET-10: Permission enforcement middleware must exist and be wired
      - name: "Auth: Permission enforcement middleware exists"
        run: |
          [ -f backend/internal/middleware/permissions.go ] || { echo "❌ B-SET-10: permissions.go missing"; exit 1; }
          grep -q "PermissionEnforcer" backend/cmd/server/main.go || { echo "❌ B-SET-10: PermissionEnforcer not wired in main.go"; exit 1; }
          echo "✅ Permission enforcement middleware wired"

      # B-AUTH-02: Forgot password option must exist on login page + backend endpoints
      - name: "Auth: Forgot password flow exists"
        run: |
          grep -q "forgot-password" backend/cmd/server/main.go || { echo "❌ B-AUTH-02: /api/auth/forgot-password route missing"; exit 1; }
          grep -q "reset-password" backend/cmd/server/main.go || { echo "❌ B-AUTH-02: /api/auth/reset-password route missing"; exit 1; }
          grep -q "ForgotPassword" backend/internal/handlers/auth.go || { echo "❌ B-AUTH-02: ForgotPassword handler missing"; exit 1; }
          grep -q "ResetPassword" backend/internal/handlers/auth.go || { echo "❌ B-AUTH-02: ResetPassword handler missing"; exit 1; }
          grep -q "SendPasswordReset" backend/internal/email/smtp.go || { echo "❌ B-AUTH-02: SendPasswordReset function missing"; exit 1; }
          grep -q "Şifrenizi mi unuttunuz" frontend/src/pages/LoginPage.tsx || { echo "❌ B-AUTH-02: Forgot password link missing from LoginPage"; exit 1; }
          echo "✅ Forgot password flow complete"

      # B-STRIPE-01: Stripe env vars must be in ECS task definition (Terraform)
      - name: "Infra: STRIPE_SECRET_KEY in ECS task definition"
        run: |
          grep -q "STRIPE_SECRET_KEY" infra/terraform/ecs.tf || { echo "❌ B-STRIPE-01: STRIPE_SECRET_KEY missing from ecs.tf"; exit 1; }
          grep -q "STRIPE_PUBLISHABLE_KEY" infra/terraform/ecs.tf || { echo "❌ B-STRIPE-01: STRIPE_PUBLISHABLE_KEY missing from ecs.tf"; exit 1; }
          echo "✅ Stripe env vars defined in ECS task definition"

      # B-STRIPE-02: SettingsPage must call /stripe/checkout with real API
      - name: "Frontend: SettingsPage calls Stripe checkout API"
        run: |
          grep -q "stripe/checkout" frontend/src/pages/SettingsPage.tsx || { echo "❌ B-STRIPE-02: SettingsPage missing Stripe checkout call"; exit 1; }
          grep -q "window.location.href" frontend/src/pages/SettingsPage.tsx || { echo "❌ B-STRIPE-02: SettingsPage missing redirect on checkout success"; exit 1; }
          echo "✅ SettingsPage wired to Stripe checkout"

      # B-BILLING-01: BillingPage must exist
      - name: "Frontend: BillingPage.tsx exists"
        run: |
          [ -f frontend/src/pages/BillingPage.tsx ] && echo "✅ BillingPage exists" || echo "⚠ B-BILLING-01: BillingPage not yet created (non-blocking)"

      # B-CARBON-01: CarbonTrackingPage must have API calls
      - name: "Frontend: CarbonTrackingPage has API calls"
        run: |
          if grep -q "api\.\|axios\|fetch" frontend/src/pages/CarbonTrackingPage.tsx 2>/dev/null; then
            echo "✅ CarbonTrackingPage has API calls"
          else
            echo "⚠ B-CARBON-01: CarbonTrackingPage has no API calls (placeholder page)"
          fi

      # B-PORTAL-01: Customer portal must have dedicated backend
      - name: "Backend: Customer portal handler exists"
        run: |
          [ -f backend/internal/handlers/customer_portal.go ] && echo "✅ Customer portal handler exists" || echo "⚠ B-PORTAL-01: No dedicated customer portal backend handler"

      # B-EXPORT-01: Export handler exists
      - name: "Backend: Export handler exists"
        run: |
          [ -f backend/internal/handlers/export.go ] && echo "✅ Export handler exists" || echo "⚠ B-EXPORT-01: No dedicated export backend handler"

      # B-ADMIN-01: Module seed migration must exist (for production RDS)
      - name: "DB: Module seed migration exists"
        run: |
          grep -q "INSERT INTO modules" backend/internal/database/migrations/012_seed_modules.sql || { echo "❌ B-ADMIN-01: Module seed migration (012) missing or incomplete"; exit 1; }
          echo "✅ Module seed migration exists"

      # B-ADMIN-02: Dashboard must query real paket_dagilimi from DB
      - name: "Backend: Dashboard queries real paket_dagilimi"
        run: |
          grep -q "paketDagilimi\|paket_dagilimi.*SELECT\|GROUP BY plan" backend/internal/handlers/admin.go || { echo "❌ B-ADMIN-02: Dashboard paket_dagilimi not queried from DB"; exit 1; }
          echo "✅ Dashboard paket_dagilimi uses real DB query"

      # B-ADMIN-03: Dashboard must query real son_kayitlar from DB
      - name: "Backend: Dashboard queries real son_kayitlar"
        run: |
          grep -q "sonKayitlar\|son_kayitlar.*SELECT\|firma_unvani.*plan.*created_at.*LIMIT" backend/internal/handlers/admin.go || { echo "❌ B-ADMIN-03: Dashboard son_kayitlar not queried from DB"; exit 1; }
          echo "✅ Dashboard son_kayitlar uses real DB query"

      # IMP-052: access_mgmt module must exist in migration
      - name: "DB: access_mgmt module seed exists"
        run: |
          grep -q "access_mgmt" backend/internal/database/migrations/013_access_mgmt.sql || { echo "❌ IMP-052: access_mgmt seed migration missing"; exit 1; }
          echo "✅ access_mgmt seed migration exists"

      # B-TRK-02: yakit_tipi column must exist in trucks table
      - name: "DB: trucks table has yakit_tipi column"
        run: |
          if grep -q "trucks" database/01-schema.sql && grep -q "yakit_tipi\|fuel_type" database/01-schema.sql; then
            echo "✅ yakit_tipi column present in schema"
          else
            echo "⚠ B-TRK-02: Verify yakit_tipi column in trucks table (P3)"
          fi

      # B-LOAD-02: Interest/WhatsApp buttons must be visible regardless of list state
      - name: "Frontend: LoadBoardPage interest buttons visible in empty state"
        run: |
          if grep -q "İlgileniyorum\|interest" frontend/src/pages/LoadBoardPage.tsx 2>/dev/null; then
            echo "✅ Interest button exists in LoadBoardPage"
          else
            echo "⚠ B-LOAD-02: Interest button missing from LoadBoardPage (P3)"
          fi

      # B-LOAD-03: LoadBoardPage must have stats summary
      - name: "Frontend: LoadBoardPage has stats summary cards"
        run: |
          if grep -q "stats\|summary\|toplam.*ilan\|aktif.*yük" frontend/src/pages/LoadBoardPage.tsx 2>/dev/null; then
            echo "✅ LoadBoardPage has stats/summary section"
          else
            echo "⚠ B-LOAD-03: LoadBoardPage missing stats summary cards (P3)"
          fi

      # B-CEK-01: CekSenetPage must have 4 KPI cards
      - name: "Frontend: CekSenetPage has 4 KPI cards"
        run: |
          KPI_COUNT=$(grep -c "KpiCard\|kpi\|Toplam\|Bekleyen\|Tahsil\|Karşılıksız" frontend/src/pages/CekSenetPage.tsx 2>/dev/null || echo "0")
          if [ "$KPI_COUNT" -ge 4 ] 2>/dev/null; then
            echo "✅ CekSenetPage has $KPI_COUNT KPI references"
          else
            echo "⚠ B-CEK-01: CekSenetPage may have <4 KPI cards — check spec (P3)"
          fi

  # ============================================================
  # JOB 5: API SMOKE (UI_Test_Directives + module test results)
  # ============================================================
  api-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unysol
          POSTGRES_PASSWORD: unysol
          POSTGRES_DB: unysol
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 3
        ports: ['5432:5432']

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 3
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Init DB schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=unysol psql -h localhost -U unysol -d unysol -f database/01-schema.sql 2>&1 | tail -3

      - name: Start backend
        env:
          PORT: '8080'
          DATABASE_URL: 'postgres://unysol:unysol@localhost:5432/unysol?sslmode=disable'
          JWT_SECRET: 'ci-test-secret-change-in-production-32chars'
          REDIS_URL: 'redis://localhost:6379/0'
          ENVIRONMENT: 'development'
        run: |
          cd backend
          CGO_ENABLED=0 go build -o /tmp/server ./cmd/server
          /tmp/server &
          sleep 3
          curl -s --retry 5 --retry-delay 1 http://localhost:8080/api/system/health

      # UI_Test_Directives Step 1: Create records
      - name: "CRUD: Signup + Login"
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"tenant_name":"CI Test","email":"ci@test.com","password":"CIREDACTED"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || echo "")
          [ -n "$TOKEN" ] && echo "TOKEN obtained" || echo "TOKEN from signup failed (email verification may be required)"
          # Login with existing test account (cinar@test.com would exist only if DB seeds run)
          TOKEN2=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"CIREDACTED"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || echo "")

      # UI_Test_Directives Step 2: Verify endpoints exist (compile-time check)
      - name: Endpoint count check
        run: |
          ENDPOINTS=$(grep -c 'r\.\(Get\|Post\|Put\|Delete\|Mount\)' backend/cmd/server/main.go)
          echo "Route registrations: $ENDPOINTS"
          [ "$ENDPOINTS" -ge 30 ] || { echo "Expected >=30 route registrations"; exit 1; }

      # yukpanosumoduleimprovements.md: Load board endpoints
      - name: Load board endpoints exist
        run: |
          grep -q "ExpressInterest\|interest" backend/internal/handlers/loadboard.go || { echo "Interest endpoint missing"; exit 1; }
          grep -q "func.*Stats" backend/internal/handlers/loadboard.go || { echo "Stats endpoint missing"; exit 1; }

  # ============================================================
  # JOB 6: BUILD ARTIFACTS (STATICWORKFLOWANDTEST.md)
  # ============================================================
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STATICWORKFLOWANDTEST.md: Build artifacts integrity
      - name: Dockerfile exists for backend + frontend
        run: |
          [ -f backend/Dockerfile ] || { echo "Backend Dockerfile missing"; exit 1; }
          [ -f frontend/Dockerfile ] || { echo "Frontend Dockerfile missing"; exit 1; }

      # QA environment: must mirror production topology
      - name: QA environment files present
        run: |
          [ -f docker-compose.qa.yml ] || { echo "docker-compose.qa.yml missing"; exit 1; }
          [ -f Caddyfile ] || { echo "Caddyfile missing"; exit 1; }
          [ -f qa.sh ] || { echo "qa.sh missing"; exit 1; }
          [ -f .env.qa ] || { echo ".env.qa missing"; exit 1; }
          echo "✅ QA environment files present"

      - name: QA compose has Caddy (mirrors ALB)
        run: |
          grep -q "caddy:" docker-compose.qa.yml || { echo "Caddy service missing from QA compose"; exit 1; }
          echo "✅ QA compose includes Caddy reverse proxy"

      - name: QA compose routes match production ALB
        run: |
          grep -q "reverse_proxy backend:8080" Caddyfile || { echo "Caddyfile missing backend route"; exit 1; }
          grep -q "reverse_proxy frontend:5173" Caddyfile || { echo "Caddyfile missing frontend route"; exit 1; }
          echo "✅ Caddyfile routes match production ALB"

      # Deployment rules enforcement
      - name: "Deploy rules: DEPLOYMENT_RULES.md exists"
        run: |
          [ -f DEPLOYMENT_RULES.md ] || { echo "DEPLOYMENT_RULES.md missing"; exit 1; }

      - name: "Deploy rules: environment protection configured"
        run: |
          grep -q "environment:" .github/workflows/deploy.yml || { echo "deploy.yml missing environment protection"; exit 1; }
          grep -q "name: production" .github/workflows/deploy.yml || { echo "deploy.yml missing production environment"; exit 1; }
          echo "✅ Deploy environment protection configured"

      - name: "Deploy rules: workflow_dispatch only (no auto-deploy)"
        run: |
          if grep -A5 "on:" .github/workflows/deploy.yml | grep -q "push:"; then
            echo "❌ deploy.yml has auto-deploy on push — must be workflow_dispatch only"
            exit 1
          fi
          grep -q "workflow_dispatch:" .github/workflows/deploy.yml || { echo "deploy.yml missing workflow_dispatch"; exit 1; }
          echo "✅ Deploy is manual-only (workflow_dispatch)"

      - name: docker-compose.yml exists
        run: |
          [ -f docker-compose.yml ] || { echo "docker-compose.yml missing"; exit 1; }

      - name: Caddyfile exists
        run: |
          [ -f Caddyfile ] || echo "Caddyfile missing (OK for local dev)"

      # BUILT.md: Check .env.example is updated
      - name: .env.example has required vars
        run: |
          grep -q "JWT_SECRET" .env.example || { echo "JWT_SECRET missing in .env.example"; exit 1; }
          grep -q "DATABASE_URL" .env.example || { echo "DATABASE_URL missing in .env.example"; exit 1; }

      # Bundle size check
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Bundle size < 2.5MB
        run: |
          SIZE=$(stat -c%s frontend/dist/assets/index-*.js 2>/dev/null | sort -rn | head -1)
          SIZE_MB=$(echo "scale=1; $SIZE/1048576" | bc)
          echo "Main JS bundle: ${SIZE_MB}MB"
          [ "${SIZE_MB%.*}" -lt 3 ] || { echo "Bundle too large (>3MB)"; exit 1; }

  # ============================================================
  # JOB 7: LANDING PAGE (saaslandingpageimprovement.md)
  # ============================================================
  landing-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Landing page has Turkish hero
        run: |
          grep -q "Yük Bul" frontend/src/i18n/locales/tr.json || { echo "Turkish hero text missing"; exit 1; }

      - name: Landing page has pricing (FREE/PRO/PREMIUM)
        run: |
          grep -q "FREE\|PRO\|PREMIUM" frontend/src/pages/LandingPage.tsx || { echo "Pricing missing"; exit 1; }

      - name: Landing page has WhatsApp share
        run: |
          grep -q "wa.me\|WhatsApp\|whatsapp" frontend/src/pages/LandingPage.tsx || echo "WhatsApp share missing (optional)"

      - name: Landing page has referral section
        run: |
          grep -q "Arkadaşına\|referans\|3 ay" frontend/src/pages/LandingPage.tsx || echo "Referral section missing (optional)"

      - name: Landing page has cookie consent
        run: |
          grep -q "cookiesAccepted\|CookiePolicy\|çerez" frontend/src/pages/LandingPage.tsx || echo "Cookie consent missing (optional)"

  # ============================================================
  # JOB 8: PRODUCTION INTEGRITY (truckownersettingsanalysis.md)
  # ============================================================
  production-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # truckownersettingsanalysis.md: No hardcoded mock users in production pages
      - name: No mock users in Settings page
        run: |
          if grep -q "kemal@unysolar\|ayse@unysolar\|can@unysolar" frontend/src/pages/SettingsPage.tsx 2>/dev/null; then
            echo "❌ FAIL: SettingsPage.tsx has hardcoded mock users (Kemal, Ayşe, Can)"
            echo "   These must be replaced with real API data — see truckownersettingsanalysis.md"
            exit 1
          else
            echo "✅ No mock users found"
          fi

      # truckownersettingsanalysis.md: No mock data fallbacks in any page
      - name: No hardcoded test emails in pages
        run: |
          MOCKS=$(grep -n "kemal@\|ayse@\|can@" frontend/src/pages/SettingsPage.tsx 2>/dev/null || true)
          if [ -n "$MOCKS" ]; then
            echo "❌ FAIL: Mock email addresses found in SettingsPage:"
            echo "$MOCKS"
            exit 1
          else
            echo "✅ No mock user emails in SettingsPage"
          fi

      # truckownersettingsanalysis.md: Settings page must fetch real data from API
      - name: Settings page uses real API (not mock)
        run: |
          if grep -q "api.get.*settings\|api.get.*tenant" frontend/src/pages/SettingsPage.tsx 2>/dev/null; then
            echo "✅ SettingsPage calls API for data"
          else
            echo "❌ FAIL: SettingsPage does not call any API — may be using mock data only"
            exit 1
          fi

      # truckownersettingsanalysis.md: PRO upgrade button must exist
      - name: PRO upgrade path exists
        run: |
          if grep -q "PRO.*Yükselt\|plan.*upgrade\|stripe\|checkout" frontend/src/pages/SettingsPage.tsx 2>/dev/null; then
            echo "✅ PRO upgrade button exists"
          else
            echo "⚠️  No PRO upgrade button found in Settings"
          fi

      # truckownersettingsanalysis.md: Fuel tracking module registered (gap tracking)
      - name: Fuel tracking module reminder
        run: |
          if grep -q "fuel_logging" database/01-schema.sql 2>/dev/null; then
            echo "✅ fuel_logging module registered in DB"
          fi
          MISSING_UI=$(ls frontend/src/pages/FuelPage.tsx 2>/dev/null || echo "")
          if [ -z "$MISSING_UI" ]; then
            echo "⚠️  fuel_logging module has NO frontend page (see modulecomparisongrid.md)"
          fi

      # truckownersettingsanalysis.md: settings page has no hardcoded plan limits
      - name: Plan limits use config (not hardcoded)
        run: |
          if grep -q "FREE.*5.*kamyon\|Firma Bilgileri" frontend/src/pages/SettingsPage.tsx 2>/dev/null; then
            echo "✅ Settings page active"
          fi

      # B-SET-03: Delete user button must have onClick handler (now in AccessManagementPage)
      - name: "Settings: Delete button has onClick handler"
        run: |
          if (grep -B2 "Trash2" frontend/src/pages/SettingsPage.tsx 2>/dev/null | grep -q "onClick") || \
             (grep -B2 "Trash2" frontend/src/pages/AccessManagementPage.tsx 2>/dev/null | grep -q "onClick"); then
            echo "✅ Delete button has onClick handler"
          else
            echo "❌ B-SET-03: Delete button has no onClick handler"
            exit 1
          fi

      # B-SET-04: Notifications must be wired to backend API
      - name: "Settings: Notifications wired to backend API"
        run: |
          if grep -q "notification_prefs\|handleToggleNotification\|notifications" frontend/src/pages/SettingsPage.tsx; then
            echo "✅ Notifications wired to backend"
          else
            echo "❌ B-SET-04: Notifications toggles not wired to backend"
            exit 1
          fi

      # B-SET-06: onCreated callback must accept user data (now in AccessManagementPage)
      - name: "Settings: onCreated uses optimistic user add"
        run: |
          if (grep -q "onCreated={(newUser)" frontend/src/pages/SettingsPage.tsx 2>/dev/null && \
             grep -q "setUsers(prev => \[...prev" frontend/src/pages/SettingsPage.tsx 2>/dev/null && \
             grep -q "onCreated: (user:" frontend/src/components/AddUserModal.tsx 2>/dev/null) || \
             (grep -q "fetchUsers\|handleCreate" frontend/src/pages/AccessManagementPage.tsx 2>/dev/null); then
            echo "✅ onCreated/user create has proper list refresh"
          else
            echo "❌ B-SET-06: User create does not refresh list"
            exit 1
          fi

      # B-SET-05: Upgrade button must have fallback
      - name: "Settings: PRO upgrade has fallback response"
        run: |
          if grep -A15 "handleUpgrade" frontend/src/pages/SettingsPage.tsx | grep -qE "upgradeMsg|catch"; then
            echo "✅ PRO upgrade has fallback handler"
          else
            echo "❌ B-SET-05: PRO upgrade has no visible fallback response"
            exit 1
          fi

      # B-UI-01: Sidebar must filter by user permissions
      - name: "Sidebar filters by user permissions"
        run: |
          if grep -q "my-permissions\|filteredItems\|permittedModules" frontend/src/components/Sidebar.tsx; then
            echo "✅ Sidebar filters by user permissions"
          else
            echo "❌ B-UI-01: Sidebar does not filter by permissions"
            exit 1
          fi

      # B-UI-02: AccessDenied component must exist
      - name: "AccessDenied component exists"
        run: |
          [ -f frontend/src/components/AccessDenied.tsx ] || { echo "❌ B-UI-02: AccessDenied.tsx missing"; exit 1; }
          grep -q "Erişim Reddedildi" frontend/src/components/AccessDenied.tsx || { echo "❌ B-UI-02: AccessDenied missing Turkish message"; exit 1; }
          echo "✅ AccessDenied component present"

      # B-EMP-01: EmployeesPage list refreshes after employee add
      - name: "B-EMP-01: Employee create refreshes list"
        run: |
          if grep -A30 "handleSubmit\|handleSave\|handleCreate" frontend/src/pages/EmployeesPage.tsx 2>/dev/null | grep -qE "setEmployees|fetchEmployees|\.get\(.*employees"; then
            echo "✅ Employee create refreshes list after save"
          else
            if [ ! -f frontend/src/pages/EmployeesPage.tsx ]; then
              echo "ℹ️  EmployeesPage.tsx not found (unified into Settings)"
            else
              echo "❌ B-EMP-01: Employee create does not refresh list after save"
              exit 1
            fi
          fi

      # B-RPT-01: Reports page must call existing endpoints (not /api/tenant/reports root)
      - name: "B-RPT-01: Reports page endpoint check"
        run: |
          if [ -f frontend/src/pages/ReportsPage.tsx ]; then
            if grep -q "/api/tenant/reports\b" frontend/src/pages/ReportsPage.tsx && \
               ! grep -q "/api/tenant/reports/" frontend/src/pages/ReportsPage.tsx; then
              echo "❌ B-RPT-01: ReportsPage may call /api/tenant/reports (404 — use sub-routes)"
              exit 1
            fi
            echo "✅ Reports page uses valid endpoints"
          else
            echo "ℹ️  ReportsPage.tsx not found"
          fi

      # Module wiring: every .func module must have Route + Page + Handler
      - name: "Module spec wiring: .func → Route + Page + API"
        run: |
          echo "Checking module wiring against .func specs..."
          ERRORS=0
          for f in *.func; do
            [ -f "$f" ] || continue
            MOD=$(basename "$f" .func)
            echo -n "  $MOD: "
            
            # Check for page component
            PAGE_OK=0
            for p in frontend/src/pages/*.tsx; do
              if echo "$p" | grep -qi "$(echo $MOD | tr '_' '[-_]')"; then PAGE_OK=1; break; fi
            done
            # Special cases
            case "$MOD" in
              auth) PAGE_OK=1;;
              dashboard) PAGE_OK=1;;
              tenant_mgmt) PAGE_OK=1;;
            esac
            
            # Check for route in App.tsx
            ROUTE_OK=0
            if grep -qi "$MOD" frontend/src/App.tsx 2>/dev/null; then ROUTE_OK=1; fi
            case "$MOD" in
              auth) ROUTE_OK=1;;
              tenant_mgmt) ROUTE_OK=1;;
            esac
            
            # Check for handler
            HANDLER_OK=0
            for h in backend/internal/handlers/*.go; do
              if echo "$h" | grep -qi "$(echo $MOD | tr '_' '[-_]')"; then HANDLER_OK=1; break; fi
            done
            
            if [ $PAGE_OK -eq 1 ] && [ $ROUTE_OK -eq 1 ] && [ $HANDLER_OK -eq 1 ]; then
              echo "✅"
            else
              echo "❌ page=$PAGE_OK route=$ROUTE_OK handler=$HANDLER_OK"
              ERRORS=$((ERRORS+1))
            fi
          done
          echo "Modules with issues: $ERRORS"
          [ "$ERRORS" -le 2 ] || { echo "❌ Too many unwired modules"; exit 1; }
          echo "✅ Module wiring OK"

      # IMP-054: Resend API integration must exist
      - name: "IMP-054: Resend email integration exists"
        run: |
          if [ -f backend/internal/email/resend.go ]; then
            echo "✅ resend.go exists"
          else
            echo "❌ IMP-054: backend/internal/email/resend.go not found"
            exit 1
          fi
          if grep -q "resend" backend/internal/email/smtp.go; then
            echo "✅ resend method wired in smtp.go"
          else
            echo "❌ IMP-054: resend method not wired in smtp.go"
            exit 1
          fi
          if grep -q "resend_api_key" backend/internal/handlers/email.go; then
            echo "✅ resend_api_key in email handler"
          else
            echo "❌ IMP-054: resend_api_key not in email handler"
            exit 1
          fi
          if grep -q "resend_api_key" frontend/src/pages/AdminDashboard.tsx; then
            echo "✅ Resend API key field in AdminDashboard"
          else
            echo "❌ IMP-054: Resend API key field missing from AdminDashboard"
            exit 1
          fi
          echo "✅ IMP-054: Resend integration complete"


            exit 1
          fi

      - name: "IMP-059: Account enumeration prevention"
        run: |
          if grep -q "existing > 0" backend/internal/handlers/auth.go && \
             grep -q "requires_verification.*true" backend/internal/handlers/auth.go; then
            echo "✅ Enumeration prevention present"
          else

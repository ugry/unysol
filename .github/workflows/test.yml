            echo "✅ DELETE route registered"
          else
            echo "❌ IMP-055: DELETE route not registered"
            exit 1
          fi
          if grep -q "DeleteModal\|deleteModal\|Firmayı Sil" frontend/src/pages/AdminDashboard.tsx; then
            echo "✅ Delete modal in AdminDashboard"
          else
            echo "❌ IMP-055: Delete modal missing from AdminDashboard"
            exit 1
          fi
          echo "✅ IMP-055: Tenant deletion with export complete"

